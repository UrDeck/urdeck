name: Site

# Publishes the website (site/) to GitHub Pages. Only from main, never from a pull request: the pull request's check is
# the `site` job of ci.yml. A workflow-level `paths:` filter is fine here because no required check lives in this file.
# A published release rebuilds it too, for the version label.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/schemas/**'
      - '.github/workflows/site-deploy.yml'
  # A published release changes the version the landing page shows (the download link itself never changes).
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # A release event runs on the tag's commit, which can be older than the site on main: always build main.
      - uses: actions/checkout@v7
        with:
          ref: main

      # v6.1.3. Installs with npm ci, runs `npm run build` (with the site's checks) and uploads the Pages artifact.
      - uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247
        with:
          path: site
        env:
          GITHUB_TOKEN: ${{ github.token }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
