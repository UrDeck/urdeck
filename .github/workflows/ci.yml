name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Required status check: build, format, tests, coverage floor and OpenSpec validation.
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Restore
        run: dotnet restore urdeck.slnx

      - name: Format
        run: dotnet format urdeck.slnx --no-restore --verify-no-changes --severity warn

      - name: Build
        run: dotnet build urdeck.slnx -c Release --no-restore

      - name: Test
        run: dotnet test urdeck.slnx -c Release --no-build

      - name: Coverage floor (UrDeck.Engine)
        run: dotnet test tests/UrDeck.Engine.Tests -c Release --no-build -p:CollectCoverage=true

      - name: Validate OpenSpec
        run: npx --yes @fission-ai/openspec@1.7.0 validate --all --strict

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: artifacts/coverage/
          if-no-files-found: ignore

  # The tests on Linux, in preparation for a cross-platform command line tool. urdeck.slnx holds the host, which needs
  # Windows, so the test projects are built directly. Tests of Windows-only code are skipped there.
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test (engine)
        run: dotnet test tests/UrDeck.Engine.Tests -c Release

      - name: Test (analyzer)
        run: dotnet test tests/UrDeck.Analyzer.Tests -c Release

  # Required status check: the PR title becomes the squash commit title, so it must be a conventional commit.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            perf
            refactor
            chore
            ci
            build
            revert
