name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides which jobs below run. A skipped job counts as passed, so ci-ok (the required check) is what catches a failure
  # here. `code` is a deny-list: everything not named is built, so a new folder is checked by default.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code_candidate == 'true' || steps.filter.outputs.code_schema == 'true' || steps.filter.outputs.code_workflow == 'true' }}
      openspec: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.openspec == 'true' }}
      site: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.site == 'true' }}
    steps:
      - uses: actions/checkout@v7

      # v3.0.4. `every`: a file counts for a filter only when it matches all of its patterns (the `!` ones exclude).
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          predicate-quantifier: every
          filters: |
            code_candidate:
              - '**'
              - '!*.md'
              - '!docs/**'
              - '!openspec/**'
              - '!site/**'
              - '!.github/**'
              - '!LICENSE'
              - '!PLUGIN-EXCEPTION.md'
              - '!THIRD-PARTY-NOTICES.md'
            code_schema:
              - 'docs/schemas/**'
            code_workflow:
              - '.github/workflows/ci.yml'
            openspec:
              - 'openspec/**'
            site:
              - 'site/**'
              - 'docs/schemas/**'
              - '.github/workflows/site-deploy.yml'

  # Build, format, tests and coverage floor (gated through ci-ok).
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore urdeck.slnx

      - name: Format
        run: dotnet format urdeck.slnx --no-restore --verify-no-changes --severity warn

      - name: Build
        run: dotnet build urdeck.slnx -c Release --no-restore

      - name: Test
        run: dotnet test urdeck.slnx -c Release --no-build

      - name: Coverage floor (UrDeck.Engine)
        run: dotnet test tests/UrDeck.Engine.Tests -c Release --no-build -p:CollectCoverage=true

      - name: Smoke test (urdeck-cli)
        shell: bash
        run: |
          set -euo pipefail
          cli="dotnet tools/UrDeck.Cli/bin/Release/net10.0/urdeck-cli.dll"
          builtin=src/UrDeck.Engine/Backgrounds/Builtin
          $cli shader validate --all "$builtin" --fail-on-warnings
          out="$RUNNER_TEMP/samples"
          mkdir -p "$out"
          for name in plasma aurora gradient julia; do
            $cli shader render "$builtin/$name" -o "$out/$name.png" --fail-on-warnings
            test -s "$out/$name.png"
          done
          # init on a loose copy of a built-in shader, a sample recorded in the manifest, then a check (warnings only: exit 0).
          work="$RUNNER_TEMP/init"
          mkdir -p "$work"
          cp "$builtin/plasma/plasma.sksl" "$work/mine.sksl"
          $cli shader init "$work/mine.sksl"
          $cli shader render "$work/mine" -o "$work/mine/sample.png" --update-manifest
          $cli shader validate "$work/mine"

      - name: Pack (urdeck-cli)
        run: dotnet pack tools/UrDeck.Cli -c Release --no-build

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: artifacts/coverage/
          if-no-files-found: ignore

  # The tests on Linux, and urdeck-cli (which runs there as well). urdeck.slnx holds the host, which needs Windows, so the
  # test projects are built directly. Tests of Windows-only code are skipped there.
  test-linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test (engine)
        run: dotnet test tests/UrDeck.Engine.Tests -c Release

      - name: Test (analyzer)
        run: dotnet test tests/UrDeck.Analyzer.Tests -c Release

      - name: Test (urdeck-cli)
        run: dotnet test tests/UrDeck.Cli.Tests -c Release

      - name: Smoke test (urdeck-cli)
        shell: bash
        run: |
          set -euo pipefail
          cli="dotnet tools/UrDeck.Cli/bin/Release/net10.0/urdeck-cli.dll"
          builtin=src/UrDeck.Engine/Backgrounds/Builtin
          $cli shader validate --all "$builtin" --fail-on-warnings
          out="$RUNNER_TEMP/samples"
          mkdir -p "$out"
          for name in plasma aurora gradient julia; do
            $cli shader render "$builtin/$name" -o "$out/$name.png" --fail-on-warnings
            test -s "$out/$name.png"
          done
          # init on a loose copy of a built-in shader, a sample recorded in the manifest, then a check (warnings only: exit 0).
          work="$RUNNER_TEMP/init"
          mkdir -p "$work"
          cp "$builtin/plasma/plasma.sksl" "$work/mine.sksl"
          $cli shader init "$work/mine.sksl"
          $cli shader render "$work/mine" -o "$work/mine/sample.png" --update-manifest
          $cli shader validate "$work/mine"

  openspec:
    needs: changes
    if: needs.changes.outputs.openspec == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate OpenSpec
        run: npx --yes @fission-ai/openspec@1.7.0 validate --all --strict

  # The website (site/): a build with its checks (schema copy, internal links, third-party references). Publishing is
  # site-deploy.yml, on main only.
  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Build and check
        run: npm run build

  # Required status check, the one gate for the jobs above. Skipped counts as passed; failed or cancelled (a failed
  # `changes` included) fails it. Every job except pr-title belongs in `needs`: add a new job here in the pull request that adds it.
  ci-ok:
    needs: [changes, build, test-linux, openspec, site]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac

  # Required status check: the PR title becomes the squash commit title, so it must be a conventional commit.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            perf
            refactor
            chore
            ci
            build
            revert
