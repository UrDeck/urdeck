name: Security

on:
  # Skipped for pull requests that only touch paths known not to affect the build or the dependencies (the deny-list of
  # ci.yml). None of these jobs is a required check, so a skipped workflow blocks nothing. push and schedule run everything.
  pull_request:
    paths:
      - '**'
      - '!*.md'
      - '!docs/**'
      - '!openspec/**'
      - '!site/**'
      - '!.github/**'
      - '.github/workflows/security.yml'
      - '!LICENSE'
      - '!PLUGIN-EXCEPTION.md'
      - '!THIRD-PARTY-NOTICES.md'
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # New or changed dependencies in a PR: fails on known vulnerabilities and on licenses incompatible with GPL-3.0-or-later.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  # Whole dependency graph against the OSV database (also catches advisories published after a package was added).
  osv-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        with:
          scan-args: |-
            --recursive
            ./

  codeql:
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
      - run: dotnet build urdeck.slnx -c Release
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
